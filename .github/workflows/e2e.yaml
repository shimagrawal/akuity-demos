name: e2e

# End-to-end test of every demo with a demo.yaml, one job each: real Kargo +
# Argo CD in a kind cluster run the demo's own files and promote its stages.
# Slow (~5-15 min), so it runs only when a flow or the shared tooling changes,
# weekly to catch upstream drift, and on demand. The fast `validate` workflow
# stays the check for every PR.
on:
  pull_request:
    paths:
      - '*/kargo/**'
      - '*/argocd/**'
      - '*/demo.yaml'
      - 'tools/e2e/**'
      - 'tools/lib.sh'
      - 'Taskfile.yaml'
      - '.github/workflows/e2e.yaml'
  # schedule:
  #   - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels a run still in progress.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every top-level folder with a demo.yaml, as a JSON list for the matrix.
  demos:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.find.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list="$(for f in */demo.yaml; do dirname "$f"; done | jq -R . | jq -sc .)"
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Demos: $list"

  e2e:
    needs: demos
    name: e2e (${{ matrix.demo }})
    strategy:
      fail-fast: false
      matrix:
        demo: ${{ fromJSON(needs.demos.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Keep the cluster after the test so the diagnostics step can inspect it;
      # the runner is thrown away afterwards anyway.
      KEEP: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-kubectl@v4
        with:
          version: v1.36.1

      - uses: azure/setup-helm@v4

      - name: Install kind and yq
        env:
          KIND_VERSION: v0.32.0
          # Pinned rather than the runner's copy, whose version changes with the image.
          YQ_VERSION: v4.47.1
        run: |
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          sudo curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          kind version
          yq --version

      - name: End-to-end test
        run: task e2e DEMO=${{ matrix.demo }}

      - name: Diagnostics
        if: failure()
        run: |
          export KUBECONFIG=tools/e2e/kubeconfig   # the test cluster's own kubeconfig
          project="$(yq -r .name "${{ matrix.demo }}/demo.yaml")"
          kubectl get pods -A || true
          kubectl -n "$project" get promotions,freight,stages || true
          kubectl -n argocd get applications -o wide || true
          kubectl -n kargo logs deploy/kargo-controller --tail=100 || true
