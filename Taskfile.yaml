version: '3'

dotenv: ['.env']

vars:
  # Versions the local schema checks are pinned to. Match them to your
  # environment. Schemas are generated into tools/schemas on first use.
  #   Kargo: the open-source release your Akuity instance is built on
  #          (Akuity v1.12.2-ak.0 → v1.12.2)
  #   Argo CD: the open-source release your Akuity instance is built on
  #          (Akuity v3.5.4-ak.0 → v3.5.4)
  #   Kubernetes: your cluster's server version (`kubectl version`)
  KARGO_VERSION: v1.12.2
  ARGOCD_VERSION: v3.5.4
  K8S_VERSION: 1.36.1

# Passed to tools/*.sh.
env:
  KARGO_VERSION: '{{.KARGO_VERSION}}'
  ARGOCD_VERSION: '{{.ARGOCD_VERSION}}'
  K8S_VERSION: '{{.K8S_VERSION}}'

includes:
  oci:
    taskfile: ./oci-flow/Taskfile.yaml
    dir: ./oci-flow

tasks:
  default:
    cmds:
      - task --list

  check:
    desc: Check .env and required CLIs
    cmds:
      - |
        set -e
        [ -f .env ] || { echo "ERROR: .env not found. Run: cp .env.example .env"; exit 1; }
        for var in AKUITY_ORG_NAME AKUITY_ARGOCD_INSTANCE_NAME AKUITY_KARGO_INSTANCE_NAME \
                   ARGOCD_DESTINATION GITOPS_REPO_URL GITHUB_USERNAME GITHUB_PAT OCI_REPO_PREFIX; do
          [ -n "$(printenv "$var")" ] || { echo "ERROR: $var is not set"; exit 1; }
        done
        for tool in akuity kargo envsubst kubectl flux-schema yq python3; do
          command -v "$tool" >/dev/null || { echo "ERROR: $tool is not installed"; exit 1; }
        done
        echo "✓ .env and tools look good"
  
  # --- Shared tooling. Works for any demo folder with a demo.yaml. ----------

  validate:
    desc: Validate a demo (DEMO=oci-flow), or every demo when DEMO is not set (~1s each)
    silent: true
    deps: [schemas]
    preconditions:
      - sh: command -v flux-schema
        msg: 'flux-schema is not installed: see the README'
    vars:
      DEMOS:
        sh: '{{if .DEMO}}echo {{.DEMO}}{{else}}for f in */demo.yaml; do dirname "$f"; done{{end}}'
    cmds:
      - |
        demos="{{.DEMOS | catLines}}"
        set -- $demos
        rc=0
        for demo in $demos; do
          [ "$#" -gt 1 ] && printf '\n### %s\n' "$demo"
          tools/validate.sh "$demo" || rc=1
        done
        exit $rc

  render:
    desc: Render a demo's apps (DEMO=oci-flow) into <demo>/.out, or one stage to stdout (STAGE=dev)
    silent: true
    requires:
      vars: [DEMO]
    cmds:
      - tools/render.sh {{.DEMO}} {{.STAGE}}

  e2e:
    desc: End-to-end test of a demo with real Kargo + Argo CD in kind (DEMO=oci-flow; ~5-15 min; KEEP=1 keeps the cluster)
    requires:
      vars: [DEMO]
    cmds:
      - tools/e2e/e2e.sh all {{.DEMO}}

  e2e:up:
    desc: Create the e2e kind cluster with registry, Git server, Argo CD and Kargo
    cmds:
      - tools/e2e/e2e.sh up

  e2e:run:
    desc: Seed, apply, promote and check a demo on a running e2e cluster (DEMO=oci-flow; ~2-3 min)
    requires:
      vars: [DEMO]
    cmds:
      - tools/e2e/e2e.sh run {{.DEMO}}

  e2e:down:
    desc: Delete the e2e kind cluster
    cmds:
      - tools/e2e/e2e.sh down

  schemas:
    desc: Extract pinned Kargo, Argo CD and Kubernetes JSON schemas into tools/schemas
    silent: true
    cmds:
      - task: schemas:kargo
      - task: schemas:argocd
      - task: schemas:k8s

  schemas:kargo:
    desc: Extract Kargo CRD schemas at KARGO_VERSION
    silent: true
    vars:
      OUT: tools/schemas/kargo-{{.KARGO_VERSION}}
      STEPS_OUT: tools/schemas/kargo-steps-{{.KARGO_VERSION}}
      TMP:
        sh: mktemp -d "${TMPDIR:-/tmp}/kargo-crds.XXXXXX"
    status:
      - test -d {{.OUT}}
      - test -d {{.STEPS_OUT}}
    cmds:
      - defer: rm -rf {{.TMP}}
      - curl -fsSL https://github.com/akuity/kargo/archive/refs/tags/{{.KARGO_VERSION}}.tar.gz | tar -xz -C {{.TMP}}
      # CRD schemas, for flux-schema
      - rm -rf {{.OUT}}
      - flux-schema extract crd {{.TMP}}/*/charts/kargo/resources/crds/*.yaml -d {{.OUT}} --strip-description > /dev/null
      # Step config schemas, for tools/lint-task.py, which finds them by step name:
      # git-clone-config.json -> git-clone.json (shared files like argocd-common.json keep their name)
      - rm -rf {{.STEPS_OUT}} && mkdir -p {{.STEPS_OUT}}
      - for f in {{.TMP}}/*/pkg/promotion/runner/builtin/schemas/*.json; do n=$(basename "$f" .json); cp "$f" "{{.STEPS_OUT}}/${n%-config}.json"; done
      - echo "Kargo {{.KARGO_VERSION}} schemas in {{.OUT}} and {{.STEPS_OUT}}"
  
  schemas:argocd:
    desc: Extract Argo CD CRD schemas at ARGOCD_VERSION
    silent: true
    vars:
      OUT: tools/schemas/argocd-{{.ARGOCD_VERSION}}
      TMP:
        sh: mktemp -d "${TMPDIR:-/tmp}/argocd-crds.XXXXXX"
    status:
      - test -d {{.OUT}}
    cmds:
      - defer: rm -rf {{.TMP}}
      - for: [application, applicationset, appproject]
        cmd: curl -fsSL https://raw.githubusercontent.com/argoproj/argo-cd/{{.ARGOCD_VERSION}}/manifests/crds/{{.ITEM}}-crd.yaml -o {{.TMP}}/{{.ITEM}}-crd.yaml
      - rm -rf {{.OUT}}
      - flux-schema extract crd {{.TMP}}/*.yaml -d {{.OUT}} --strip-description > /dev/null
      - echo "Argo CD {{.ARGOCD_VERSION}} schemas in {{.OUT}}"

  schemas:k8s:
    desc: Extract Kubernetes schemas at K8S_VERSION
    silent: true
    vars:
      OUT: tools/schemas/k8s-{{.K8S_VERSION}}
    status:
      - test -d {{.OUT}}
    cmds:
      - rm -rf {{.OUT}}
      - flux-schema extract k8s --version {{.K8S_VERSION}} -d {{.OUT}} --strip-description > /dev/null
      - echo "Kubernetes {{.K8S_VERSION}} schemas in {{.OUT}}"
