# Applied by `task oci-per-app:apply-kargo` with values from .env. Never commit real values.

# Lets Kargo clone this repository.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-repo
  namespace: oci-flow-per-app
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: ${GITOPS_REPO_URL}
  username: ${GITHUB_USERNAME}
  password: ${GITHUB_PAT}
---
# Lets Kargo push every app's rendered manifests to GHCR, and the -manifests
# Warehouses read them: one credential for every repository under the prefix.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: oci-flow-per-app
  labels:
    kargo.akuity.io/cred-type: image
type: Opaque
stringData:
  repoURL: ^${OCI_REPO_PREFIX}/oci-flow-per-app/
  repoURLIsRegex: "true"
  username: ${GITHUB_USERNAME}
  password: ${GITHUB_PAT}
