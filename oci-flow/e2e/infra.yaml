# What the e2e test's pipeline talks to, inside the throwaway kind cluster,
# standing in for GHCR and GitHub:
#
#   * registry: a plain OCI registry. Kargo pushes to it by ClusterIP, and its
#     registry client picks http:// for private (RFC1918) addresses, so no TLS
#     is needed. Argo CD is told the same with insecureOCIForceHttp
#     (argocd-repo.yaml).
#   * git: nginx serving a bare copy of this repository over "dumb" HTTP, which
#     Kargo's git CLI reads once `git update-server-info` has run (e2e.sh seed).
#
# Pattern from github.com/blakepettersson/curated-custom-promotion-tasks
# (oci/test/kargo/infra.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-infra
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: e2e-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:3
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: e2e-infra
spec:
  selector:
    app: registry
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git
  namespace: e2e-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: git
  template:
    metadata:
      labels:
        app: git
    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
          volumeMounts:
            - name: repos
              mountPath: /usr/share/nginx/html
      volumes:
        - name: repos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git
  namespace: e2e-infra
spec:
  selector:
    app: git
  ports:
    - port: 80
      targetPort: 80
---
# Long-running pod the checks use to curl the deployed apps from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: curl
  namespace: e2e-infra
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.11.1
      command: ["sleep", "infinity"]
