# Test-only: tells Argo CD the in-cluster registry speaks plain HTTP.
# The declarative form of `argocd repo add oci://... --type oci --insecure-oci-force-http`.
apiVersion: v1
kind: Secret
metadata:
  name: e2e-registry
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: e2e-registry
  type: oci
  url: oci://${OCI_REPO_PREFIX}/oci-flow/nginx
  insecureOCIForceHttp: "true"
