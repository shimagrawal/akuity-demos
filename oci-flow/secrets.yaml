# Applied by `task oci:apply-kargo` with values from .env. Never commit real values.

# Lets Kargo clone this repository.
apiVersion: v1
kind: Secret
metadata:
  name: gitops-repo
  namespace: oci-flow
  labels:
    kargo.akuity.io/cred-type: git
type: Opaque
stringData:
  repoURL: ${GITOPS_REPO_URL}
  username: ${GITHUB_USERNAME}
  password: ${GITHUB_PAT}
---
# Lets Kargo push the rendered manifests to GHCR.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr
  namespace: oci-flow
  labels:
    kargo.akuity.io/cred-type: image
type: Opaque
stringData:
  repoURL: ${OCI_REPO_PREFIX}/oci-flow/nginx
  username: ${GITHUB_USERNAME}
  password: ${GITHUB_PAT}
