version: '3'

# OCI flow demo: Kargo renders every app (nginx with Kustomize, hello with Helm)
# for every stage once, pushes them as one OCI artifact, and points each stage's
# Argo CD Application at that same digest. Run from the repo root: task oci:<name>

vars:
  # Only these are substituted, so Kargo's ${{ ... }} expressions are left alone.
  ENVSUBST_VARS: '${GITOPS_REPO_URL} ${OCI_REPO_PREFIX} ${ARGOCD_DESTINATION} ${GITHUB_USERNAME} ${GITHUB_PAT}'
  # Turns flux-schema's verbose lines into "✓ Kind/namespace/name  (file)".
  PRETTY: >-
    s#^\.validate/##;
    s#^\.out/([^/ ]+/[^/ ]+)/manifests\.yaml - #\1 - #;
    s# - ([a-z0-9.-]+/)?v[0-9][a-z0-9]*/# - #;
    s#^(.*) - (.*) is valid$#  ✓ \2   (\1)#;
    s#^(.*) - (.*) is invalid: (.*)$#  ✗ \2: \3   (\1)#;
    s#^(.*) - (.*) is skipped(.*)$#  - \2: skipped\3   (\1)#;
    s#^  - /#      - /#;
    s#^Summary:#  Summary:#

tasks:
  apply-argocd:
    desc: Create the Argo CD AppProject and ApplicationSet
    cmds:
      - for: [argocd/app-project.yaml, argocd/applicationset.yaml]
        cmd: >-
          envsubst '{{.ENVSUBST_VARS}}' < {{.ITEM}} |
          akuity argocd apply -f - --name "$AKUITY_ARGOCD_INSTANCE_NAME" --org-name "$AKUITY_ORG_NAME"

  apply-kargo:
    desc: Create the Kargo Project, credentials, Warehouse, PromotionTasks and Stages
    cmds:
      - for: [kargo/project.yaml, secrets.yaml, kargo/warehouse.yaml, kargo/promotiontasks.yaml, kargo/stages.yaml]
        cmd: >-
          envsubst '{{.ENVSUBST_VARS}}' < {{.ITEM}} |
          akuity kargo apply -f - --name "$AKUITY_KARGO_INSTANCE_NAME" --org-name "$AKUITY_ORG_NAME"

  setup:
    desc: Set up the whole OCI flow demo
    cmds:
      - task: apply-argocd
      - task: apply-kargo

  render:
    desc: Preview one stage locally, both apps (task oci:render STAGE=dev)
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
    cmds:
      - kubectl kustomize apps/nginx/overlays/{{.STAGE}}
      - echo "---"
      - helm template hello apps/hello -f apps/hello/values-{{.STAGE}}.yaml

  render-all:
    desc: Build the artifact layout locally (<stage>/nginx, <stage>/hello) into .out/
    vars:
      LIST: '{{.LIST | default "true"}}'
    cmds:
      - rm -rf .out
      - for: [dev, test, prod]
        cmd: >-
          mkdir -p .out/{{.ITEM}}/nginx .out/{{.ITEM}}/hello &&
          kubectl kustomize apps/nginx/overlays/{{.ITEM}} > .out/{{.ITEM}}/nginx/manifests.yaml &&
          helm template hello apps/hello -f apps/hello/values-{{.ITEM}}.yaml > .out/{{.ITEM}}/hello/manifests.yaml
      - '[ "{{.LIST}}" = "false" ] || find .out -type f | sort'
  
  validate:
    desc: Validate Kargo/Argo CD resources and rendered manifests against pinned schemas (~1s)
    # Only show the validation results, not every command.
    silent: true
    preconditions:
      - sh: command -v flux-schema
        msg: 'flux-schema is not installed: see the README'
    cmds:
      # 0. Make sure the pinned schemas exist (no-op when they do).
      - task: :schemas
        silent: true
      # 1. Kargo and Argo CD resources, with .env values substituted.
      #    Each section records a failure instead of stopping, so you see everything.
      #    secrets.yaml is left out so the PAT is never written to disk.
      - rm -rf .validate && mkdir -p .validate/kargo .validate/argocd
      - for: [kargo/project.yaml, kargo/warehouse.yaml, kargo/promotiontasks.yaml, kargo/stages.yaml, argocd/app-project.yaml, argocd/applicationset.yaml]
        cmd: envsubst '{{.ENVSUBST_VARS}}' < {{.ITEM}} > .validate/{{.ITEM}}
      - echo "Kargo {{.KARGO_VERSION}}"
      - set -o pipefail; flux-schema validate .validate/kargo -v --concurrent 1 -s {{.KARGO_SCHEMAS}} | sed -E '{{.PRETTY}}' || touch .validate/failed
      # 2. Step configs inside PromotionTasks, against Kargo's own step schemas.
      #    flux-schema can't see inside `config:`; tools/lint-task.py can.
      - echo "Kargo step configs {{.KARGO_VERSION}}"
      - |
        for f in .validate/kargo/*.yaml; do
          yq -o=json ea '[.] | map(select(.kind == "PromotionTask" or .kind == "ClusterPromotionTask"))' "$f" > "$f.json"
          [ "$(yq 'length' "$f.json")" = 0 ] && continue
          name="${f#.validate/}"
          if python3 ../tools/lint-task.py {{.KARGO_STEP_SCHEMAS}} "$f.json" > "$f.lint"; then
            name="$name" yq -r '.[] | (.spec.steps | length) as $n | "  ✓ " + .kind + "/" + .metadata.name + ": " + ($n | tostring) + (if $n == 1 then " step" else " steps" end) + "   (" + strenv(name) + ")"' "$f.json"
          else
            sed "s#^#  ✗ #; s#\$#   ($name)#" "$f.lint"
            touch .validate/failed
          fi
        done
      - echo "Argo CD {{.ARGOCD_VERSION}}"
      - set -o pipefail; flux-schema validate .validate/argocd -v --concurrent 1 -s {{.ARGOCD_SCHEMAS}} | sed -E '{{.PRETTY}}' || touch .validate/failed
      # 3. What the render steps produce, against the cluster's exact Kubernetes version.
      - task: render-all
        silent: true
        vars:
          LIST: 'false'
      - echo "Rendered manifests (Kubernetes {{.K8S_VERSION}})"
      - set -o pipefail; flux-schema validate .out -v --concurrent 1 -s {{.K8S_SCHEMAS}} | sed -E '{{.PRETTY}}' || touch .validate/failed
      # Every section runs; fail at the end if any of them found a problem.
      - test ! -e .validate/failed || { echo; echo "✗ Validation failed (see ✗ above)"; exit 1; }
      - echo; echo "✓ All resources valid"

  port-forward:
    desc: Port-forward to an app in a stage (task oci:port-forward STAGE=dev APP=hello)
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      APP: '{{.APP | default "nginx"}}'
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - echo "Open http://localhost:{{.PORT}}"
      - kubectl port-forward svc/{{.APP}} {{.PORT}}:80 -n oci-flow-{{.STAGE}}
