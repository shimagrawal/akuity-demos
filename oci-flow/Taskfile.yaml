version: '3'

# OCI flow demo: Kargo renders every stage once, pushes them as one OCI artifact,
# and points each stage's Argo CD Application at that same digest. Run from the repo root: task oci:<name>

vars:
  # Only these are substituted, so Kargo's ${{ ... }} expressions are left alone.
  ENVSUBST_VARS: '${GITOPS_REPO_URL} ${OCI_REPO_PREFIX} ${ARGOCD_DESTINATION} ${GITHUB_USERNAME} ${GITHUB_PAT}'

tasks:
  apply-argocd:
    desc: Create the Argo CD AppProject and ApplicationSet
    cmds:
      - for: [argocd/app-project.yaml, argocd/applicationset.yaml]
        cmd: >-
          envsubst '{{.ENVSUBST_VARS}}' < {{.ITEM}} |
          akuity argocd apply -f - --name "$AKUITY_ARGOCD_INSTANCE_NAME" --org-name "$AKUITY_ORG_NAME"

  apply-kargo:
    desc: Create the Kargo Project, credentials, Warehouse, PromotionTasks and Stages
    cmds:
      - for: [kargo/project.yaml, secrets.yaml, kargo/warehouse.yaml, kargo/promotiontasks.yaml, kargo/stages.yaml]
        cmd: >-
          envsubst '{{.ENVSUBST_VARS}}' < {{.ITEM}} |
          akuity kargo apply -f - --name "$AKUITY_KARGO_INSTANCE_NAME" --org-name "$AKUITY_ORG_NAME"

  setup:
    desc: Set up the whole OCI flow demo
    cmds:
      - task: apply-argocd
      - task: apply-kargo

  render:
    desc: Preview what a stage renders locally (task oci:render STAGE=dev)
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
    cmds:
      - kubectl kustomize app/overlays/{{.STAGE}}

  render-all:
    desc: Build the artifact layout locally (dev/, test/, prod/) into .out/
    cmds:
      - rm -rf .out
      - for: [dev, test, prod]
        cmd: mkdir -p .out/{{.ITEM}} && kubectl kustomize app/overlays/{{.ITEM}} > .out/{{.ITEM}}/manifests.yaml
      - find .out -type f

  port-forward:
    desc: Port-forward to a stage's nginx (task oci:port-forward STAGE=dev)
    vars:
      STAGE: '{{.STAGE | default "dev"}}'
      PORT: '{{.PORT | default "8080"}}'
    cmds:
      - echo "Open http://localhost:{{.PORT}}"
      - kubectl port-forward svc/nginx {{.PORT}}:80 -n oci-flow-{{.STAGE}}
